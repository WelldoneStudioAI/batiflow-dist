<title>Essai BatiFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* BatiFlow iPhone, mode préachat AIBQ (refonte), au point près.
   Toile de 402 × 874 pt (coordonnées des captures de l'iPhone 17 Pro), réduite à l'écran du visiteur.
   Valeurs : code SwiftUI de batiflow-app (commit e30c179) — chemins cités dans app.js. */
:root {
  color-scheme: dark;
  --orange: #F15A24;
  --anneau: #E0543E;
  --pilule: #26262B;
  --gris6: #1C1C1E;
  --ink: #1A1B1E;
  --encre: #111214;
  --gris: #5B5E64;
  --filet: #E6E6E8;
  --champ: #F4F4F5;
  --champ-c: #EEEEF0;
  --sub: #8A8F98;
  --ambre: #FAC775;
  --bleu: #0A84FF;
  --rouge-enr: #FF3B30;
  --rouge-annot: #FF453A;
  --sf: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Helvetica Neue", Arial, sans-serif;
  --inter: "Inter", -apple-system, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; }
body { margin: 0; background: #000; overflow: hidden; font-family: var(--sf); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; text-align: center; }
button:disabled { cursor: default; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--bleu); outline-offset: 2px; }
#cadre { position: absolute; left: 50%; top: calc(var(--haut, 0px) + (100% - var(--haut, 0px)) / 2); width: 402px; height: 812px; overflow: hidden; transform: translate(-50%, -50%) scale(var(--s, 1)); -webkit-user-select: none; user-select: none; }
#ecran { position: absolute; left: 0; top: -62px; width: 402px; height: 874px; overflow: hidden; }
textarea, input { -webkit-user-select: text; user-select: text; }
.ic { display: block; background: currentColor; -webkit-mask: var(--m) center / 100% 100% no-repeat; mask: var(--m) center / 100% 100% no-repeat; flex: none; }
.l1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.abs { position: absolute; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 90; }
#flash.go { animation: flash .30s linear; }
@keyframes flash { 0% { opacity: 0; } 40% { opacity: 1; } 100% { opacity: 0; } }

/* ============ Chrome de la caméra (unitCaptureChrome) ============ */
#cam { position: absolute; inset: 0; background: #000; color: #fff; }
.hb { position: absolute; top: 68px; width: 40px; height: 40px; border-radius: 50%; background: var(--gris6); box-shadow: 0 1px 5px rgba(0,0,0,.10), inset 0 0 0 .5px rgba(0,0,0,.06); display: grid; place-items: center; }
#cam-titre { position: absolute; left: 112px; width: 178px; top: 78px; height: 20px; line-height: 20px; text-align: center; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#vf { position: absolute; left: 26px; top: 124px; width: 349.7px; height: 466.3px; border-radius: 22px; overflow: hidden; background: #000; touch-action: none; }
#vf > img.fond, #vf > video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
#vf.live > img.fond { display: none; }

#grille { position: absolute; inset: 0; pointer-events: none; }

#zoom-pills button { width: 30px; height: 30px; border-radius: 50%; font-size: 11px; font-weight: 600; color: rgba(255,255,255,.85); display: grid; place-items: center; }
#zoom-pills button.on { background: rgba(255,255,255,.18); color: #FFD60A; }
#lieu-pastille { position: absolute; left: 14px; top: 14px; height: 30px; padding: 0 12px; border-radius: 99px; background: rgba(0,0,0,.55); display: flex; align-items: center; gap: 6px; font: 500 12px var(--inter); color: #fff; white-space: nowrap; z-index: 3; }
#vignettes { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 6px; z-index: 3; }
#vignettes i { width: 44px; height: 44px; border-radius: 8px; box-shadow: 0 0 0 1.5px rgba(255,255,255,.85); background: #222 center / cover no-repeat; animation: vign .22s cubic-bezier(.3,.8,.4,1); }
@keyframes vign { from { transform: scale(.6); opacity: 0; } }
#pil { position: absolute; left: 12px; top: 602.3px; width: 378px; height: 88px; border-radius: 44px; background: var(--pilule); }
.r46 { position: absolute; top: 623.3px; width: 46px; height: 46px; border-radius: 50%; color: #fff; display: grid; place-items: center; transition: transform .18s, background-color .2s; }
.r46::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: rgba(255,255,255,.12); z-index: -1; }
.r46 { isolation: isolate; }
.r46 .teinte { position: absolute; inset: 0; border-radius: 50%; z-index: -1; }
.r46.ambre55 .teinte { background: rgba(250,199,117,.55); }
.r46.ambre85 .teinte { background: rgba(250,199,117,.85); }
.r46.jaune25 .teinte { background: rgba(255,204,0,.25); }
.r46.jaune30 .teinte { background: rgba(255,204,0,.30); }
.r46.rouge .teinte { background: rgba(255,59,48,.85); }
.r46.plein-ambre::before { background: var(--ambre); }
.r46.plein-ambre { color: var(--ink); }
.r46.grand { transform: scale(1.12); }
#lieux-rond::before { background: #fff; }
#lieux-rond { color: var(--ink); }
#lieux-rond.presse::before { background: #D6D7DB; }
#lieux-rond.actif::before { background: #3A3A3F; box-shadow: inset 0 0 0 2px #fff; }
#lieux-rond.actif { color: #fff; }
#shutter { position: absolute; left: 167px; top: 612.3px; width: 68px; height: 68px; border-radius: 50%; box-shadow: inset 0 0 0 4px #fff; transition: transform .18s cubic-bezier(.3,.8,.4,1); -webkit-touch-callout: none; touch-action: none; }
#shutter .coeur { position: absolute; inset: 7px; border-radius: 50%; background: var(--orange); }
#shutter .plus { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; }

#shutter svg { position: absolute; inset: 0; width: 68px; height: 68px; transform: rotate(-90deg); pointer-events: none; }
#shutter circle { fill: none; stroke: var(--anneau); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 201.06; stroke-dashoffset: 201.06; opacity: 0; }
#shutter.arme circle { opacity: 1; stroke-dashoffset: 0; transition: stroke-dashoffset .3s linear; }
#tip { position: absolute; left: 201px; top: 578.3px; transform: translateX(-50%); font: 500 9px/11px var(--mono); letter-spacing: .8px; padding: 5px 10px; border-radius: 99px; background: rgba(0,0,0,.62); color: #fff; white-space: nowrap; pointer-events: none; }
#aide-cam { position: absolute; left: 0; width: 402px; top: 702px; height: 16px; line-height: 16px; text-align: center; font-size: 13px; color: #3D3F44; white-space: nowrap; }
#dernier { text-align: left; position: absolute; left: 12px; top: 726.3px; width: 378px; height: 46px; border-radius: 14px; background: #fff; box-shadow: inset 0 0 0 1px var(--filet); color: var(--encre); display: flex; align-items: center; gap: 10px; padding: 0 16px; box-sizing: border-box; }
#dernier .icd { width: 18px; display: grid; place-items: center; flex: none; }
#dernier .t { flex: 1; min-width: 0; font-size: 14.5px; }
#dernier .t.dict { color: #8D8E93; }
#dernier .n { font-size: 14.5px; font-variant-numeric: tabular-nums; flex: none; }
.barre-onglets { position: absolute; left: 0; top: 798px; width: 402px; height: 50px; z-index: 40; }
.tab { position: absolute; top: 0; width: 90px; height: 46px; }
.tab .ic { position: absolute; }
.tab span { position: absolute; left: 0; right: 0; top: 32px; height: 12px; line-height: 12px; font-size: 10px; font-weight: 600; text-align: center; white-space: nowrap; }
.barre-onglets.sombre .tab { color: #fff; }
.barre-onglets.claire .tab { color: #8E8E93; }
.barre-onglets.claire .tab.on { color: #000; }

/* bandeau de dictée (AIBQRefonteBandeauDictee) */
#bandeau { position: absolute; left: 14px; width: 374px; top: 122px; display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 60; animation: bandeau .25s cubic-bezier(.3,.8,.4,1); }
@keyframes bandeau { from { transform: translateY(-30px); opacity: 0; } }
#bandeau .cap { box-sizing: border-box; width: 100%; min-height: 46px; display: flex; align-items: center; gap: 8px; padding: 5px 5px 5px 14px; border-radius: 99px; background: rgba(0,0,0,.72); }

/* bulle AIBQMicroDirect, quand le navigateur n'a pas de micro */
.bulle { box-sizing: border-box; padding: 12px; border-radius: 12px; background: #F1F1F1; box-shadow: inset 0 0 0 1.5px #D93A32; color: var(--ink); display: flex; flex-direction: column; gap: 10px; }
.bulle.sombre { background: rgba(0,0,0,.34); box-shadow: inset 0 0 0 1.5px #FF5A4F; color: #fff; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.bulle .hd { display: flex; align-items: center; gap: 6px; color: #D93A32; font-size: 12px; font-weight: 600; }
.bulle.sombre .hd { color: #FF5A4F; }
.bulle .hd i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: bat .7s ease-in-out infinite alternate; flex: none; }
@keyframes bat { from { opacity: .3; } to { opacity: 1; } }
.bulle .tx { font: 500 16px/1.3 var(--sf); min-height: 21px; }
.bulle .tx.invite { color: var(--sub); }
.bulle.sombre .tx.invite { color: rgba(255,255,255,.5); }
.bulle textarea { font: 500 16px/1.3 var(--sf); color: inherit; background: transparent; border: 0; padding: 0; resize: none; height: 63px; width: 100%; }

.bulle .act button { height: 38px; padding: 0 16px; border-radius: 99px; display: flex; align-items: center; gap: 7px; font-size: 14px; }

.bulle.sombre .clavier { box-shadow: inset 0 0 0 1.2px rgba(255,255,255,.35); }
#bulle-cam { position: absolute; left: 12px; width: 378px; bottom: 282px; z-index: 61; }
.bulle textarea:focus-visible { outline: none; }

/* panneau ⚡ « RACCOURCIS » (panneauCarnets) */
#raccourcis { position: absolute; left: 38px; top: 350.3px; width: 326px; box-sizing: border-box; padding: 13px; border-radius: 24px; background: rgba(0,0,0,.85); z-index: 30; display: flex; flex-direction: column; gap: 10px; transform-origin: 50% 100%; animation: pop .22s cubic-bezier(.3,.8,.4,1); }

/* panneau des lieux (lieuxPanneau) */
#lieux-panneau { position: absolute; left: 11px; right: 11px; top: 11px; bottom: 11px; z-index: 5; border-radius: 26px; background: rgba(30,30,32,.56); -webkit-backdrop-filter: blur(24px) saturate(1.3); backdrop-filter: blur(24px) saturate(1.3); box-shadow: inset 0 0 0 .9px rgba(255,255,255,.28); padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; animation: pop .22s; }

/* tiroir ☰ (aibqTiroirDossier) */

#tiroir { position: absolute; left: 16px; top: 126px; width: 305.5px; z-index: 71; background: var(--gris6); color: #fff; border-radius: 0 24px 24px 0; box-shadow: 6px 0 22px rgba(0,0,0,.20); padding: 16px 0 16px 0; box-sizing: border-box; animation: entreGauche .25s cubic-bezier(.3,.8,.4,1); }

/* ============ Banque de constats (vue 03) ============ */

/* ===================== Parcours guidé de l'essai (propre au site) ===================== */

#scene-ia .res.attente .ti { width: 70%; height: 18px; } #scene-ia .res.attente p { margin-top: 12px; }

/* ===================== Sur ordinateur : cadre d'iPhone 17 Pro + panneau QR ===================== */
#barre-etat, #panneau-bureau { display: none; }
body.bureau { background: radial-gradient(70% 90% at 30% 50%, #2b1a10 0%, #0d0d0f 60%); }
body.bureau #cadre { height: 874px; left: calc(50% - 210px); top: calc(var(--haut, 0px) + (100% - var(--haut, 0px)) / 2); border-radius: 64px; box-shadow: 0 0 0 11px #050505, 0 0 0 13px #3a3a3c, 0 0 0 14px #1c1c1e, 0 50px 140px rgba(0,0,0,.7); }
body.bureau #ecran { top: 0; }
body.bureau #barre-etat { display: flex; position: absolute; left: 0; top: 0; width: 402px; height: 54px; z-index: 300; pointer-events: none; align-items: center; justify-content: space-between; padding: 6px 30px 0 46px; box-sizing: border-box; color: #fff; mix-blend-mode: difference; }
#barre-etat b { font: 600 17px var(--sf); letter-spacing: -.2px; }
#ile { display: none; } body.bureau #ile { display: block; position: absolute; left: 50%; top: 11px; width: 125px; height: 37px; margin-left: -62.5px; border-radius: 20px; background: #000; z-index: 301; pointer-events: none; }
#barre-etat .ind { display: flex; align-items: center; gap: 7px; }
#barre-etat .reseau { display: flex; align-items: flex-end; gap: 1.5px; height: 12px; }
#barre-etat .reseau i { width: 3px; border-radius: 1px; background: currentColor; }
#barre-etat .reseau i:nth-child(1) { height: 4px; } #barre-etat .reseau i:nth-child(2) { height: 6px; } #barre-etat .reseau i:nth-child(3) { height: 9px; } #barre-etat .reseau i:nth-child(4) { height: 12px; }
#barre-etat .pile { position: relative; width: 25px; height: 12px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.45); }
#barre-etat .pile i { position: absolute; left: 2px; top: 2px; bottom: 2px; width: 17px; border-radius: 2px; background: currentColor; }
#barre-etat .pile::after { content: ""; position: absolute; right: -3px; top: 4px; width: 1.5px; height: 4px; border-radius: 0 1px 1px 0; background: rgba(255,255,255,.45); }
body.bureau #panneau-bureau { display: block; position: fixed; left: calc(50% + 40px); top: calc(var(--haut, 0px) + (100% - var(--haut, 0px)) / 2); transform: translateY(-50%); width: min(360px, calc(50% - 64px)); color: #fff; font-family: var(--sf); animation: fondu .6s; }
#panneau-bureau .marque { display: flex; align-items: center; gap: 9px; }

#panneau-bureau .marque b { font-size: 17px; }
#panneau-bureau h1 { margin: 22px 0 12px; font-size: 38px; line-height: 1.08; letter-spacing: -1px; font-weight: 700; }
#panneau-bureau p { margin: 0 0 24px; font-size: 16px; line-height: 23px; color: rgba(235,235,245,.68); }
#panneau-bureau .qr { width: 188px; height: 188px; padding: 12px; border-radius: 22px; background: #fff; box-shadow: 0 20px 60px rgba(241,90,36,.25); }
#panneau-bureau .qr svg { display: block; width: 100%; height: 100%; }
#panneau-bureau small { display: block; margin-top: 12px; font: 500 12px var(--mono); letter-spacing: .4px; color: var(--ambre); }
#panneau-bureau ul { list-style: none; margin: 26px 0 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
#panneau-bureau li { font-size: 14.5px; color: rgba(235,235,245,.8); padding-left: 24px; position: relative; }

const VIDES = new Set('les des une dans pour avec sur sous par aux est sont que qui pas plus vers mais cette ces ses son leur nous avons ont ete fait faire elle ils il on du de la le un et ou en au'.split(' '));

  const q = [...new Set(mots(texte))]; if (!q.length) return [];

    let s = 0;
    for (const w of q) { if (e.ti.includes(w)) s += 3; else if (w.length >= 5 && e.ti.some(x => x.startsWith(w.slice(0, 5)))) s += 2; if (e.ob.has(w)) s += 1; }

À partir de la parole de l'inspecteur, rédige UN constat dans le style exact de la banque : copie la longueur, le ton et la structure des constats candidats ci-dessous.

"gravite" : un code parmi ${Object.keys(GRAV).join(', ')}. "section" : une parmi ${CATS.map(c => c[1]).join(', ')}. "sous_section" : celle du candidat le plus proche, sinon ${sousCat}.

        if (c < 128) {
          bytes.push(c);

/* ---------- 3. la scène de rédaction ---------- */
const attendre = ms => new Promise(ok => setTimeout(ok, ms));
function taper(el, texte, ms) {
  return new Promise(ok => {
    const t0 = performance.now(), n = texte.length;
    const pas = () => { const k = Math.min(n, Math.ceil((performance.now() - t0) / ms * n)); el.textContent = texte.slice(0, k); if (k < n) requestAnimationFrame(pas); else ok(); };
    pas();
  });
}
async function sceneRedaction(c) {
  if (!c.photos.length) { const p = await prendrePhoto(); p.lieu = c.lieu; c.photos.push(p); }
  const ligne = (titre) => { const d = h('div', { class: 'etape-ia' }, h('span', { class: 'rond' }), h('div', {}, h('b', {}, titre), h('small'))); return d; };
  const l1 = ligne('Parole comprise'), l2 = ligne('Banque AIBQ consultée'), l3 = ligne('Rédaction du constat');
  const carte = h('div', { class: 'res', hidden: true });
  const pied = h('div', { class: 'pied', hidden: true });
  const el = h('div', { id: 'scene-ia' },
    h('div', { class: 'haut' }, h('span', { class: 'et' }, 'Étape 3 sur 3'), h('b', {}, 'BatiFlow rédige ton constat')),
    h('div', { class: 'dit' }, h('img', { src: c.photos[0].url, alt: '' }), h('div', {}, h('small', {}, 'Ce que tu as dit'), h('q', {}, c.dictee))),
    h('div', { class: 'etapes' }, l1, l2, l3), carte, pied);
  ecran.append(el);
  const fait = (l, detail) => { l.classList.remove('cours'); l.classList.add('fait'); l.querySelector('.rond').replaceChildren(ic('check', 12, 12)); if (detail != null) l.querySelector('small').textContent = detail; };
  const encours = (l, detail) => { l.classList.add('cours'); if (detail != null) l.querySelector('small').textContent = detail; };

  /* la carte du constat se remplit pendant que l'IA écrit (flux), champ par champ, curseur au bout */
  const sev = h('span', { class: 'sev', hidden: true }), sec = h('span', { class: 'sec' }, `${catLabel(c.cat)} › ${c.sub}`);
  const tT = h('b', { class: 'ti' }), tC = h('p'), tRi = h('i'), tR = h('div', { class: 'reco', hidden: true }, h('span', {}, '→ '), tRi);
  carte.append(h('div', { class: 'tete' }, sev, sec), tT, tC, tR);
  const poserSev = g => { if (!GRAV[g]) return; const [fond, encre] = teinte(g); sev.textContent = GRAV[g][0]; sev.style.cssText = `background:${fond};color:${encre}`; sev.hidden = false; };
  const montrerCarte = () => { if (!carte.hidden) return; carte.hidden = false; carte.classList.add('attente'); requestAnimationFrame(() => carte.scrollIntoView({ behavior: 'smooth', block: 'nearest' })); };
  let enFlux = false;
  const surFlux = part => {
    if (!enFlux) { enFlux = true; encours(l3, 'L’IA écrit…'); }
    montrerCarte(); carte.classList.remove('attente');
    poserSev(part.gravite);
    const k = catParLabel(part.section); if (k) sec.textContent = `${k[1]} › ${part.sous_section || ''}`;
    tT.textContent = part.titre || ''; tC.textContent = part.constat || '';
    if (part.recommandation) { tR.hidden = false; tRi.textContent = part.recommandation; }
    const courant = ['recommandation', 'constat', 'titre'].find(f => part[f] != null);
    [tT, tC, tRi].forEach(x => x.classList.remove('curseur'));
    if (courant && !part.fini[courant]) ({ titre: tT, constat: tC, recommandation: tRi })[courant].classList.add('curseur');
  };

  const redaction = rediger(c.dictee, { cat: c.cat, sub: c.sub, surFlux });
  encours(l1); await attendre(250);
  fait(l1, `${c.dictee.split(/\s+/).filter(Boolean).length} mots · ${c.duree} s de dictée`);
  encours(l2, `${NB_BANQUE.toLocaleString('fr-CA')} constats types`); await attendre(350);
  const proches = BANQUE ? candidats(c.dictee, 3).map(x => x.e.t) : [];
  fait(l2, `${NB_BANQUE.toLocaleString('fr-CA')} constats types · ${proches.length ? 'les plus proches :' : 'comparés à ta phrase'}`);
  if (proches.length) l2.lastChild.append(h('div', { class: 'proches' }, ...proches.map(t => h('span', {}, t))));
  if (!enFlux) { encours(l3, 'Style, gravité, recommandation…'); montrerCarte(); }
  const r = await redaction;
  if (!proches.length && r?.proches?.length) { fait(l2, `${NB_BANQUE.toLocaleString('fr-CA')} constats types · les plus proches :`); l2.lastChild.append(h('div', { class: 'proches' }, ...r.proches.slice(0, 3).map(t => h('span', {}, t)))); }
  const res = r || { src: 'brouillon', cat: c.cat, sub: c.sub, gravite: 'correctif', titre: c.dictee.split(/[.,;]/)[0].slice(0, 60), constat: 'Nous avons constaté ' + c.dictee.charAt(0).toLowerCase() + c.dictee.slice(1), reco: 'Faire évaluer la situation par un entrepreneur qualifié.', lieu: '' };
  Object.assign(c, { cat: res.cat, sub: res.sub, titre: res.titre, constat: res.constat, reco: res.reco, gravite: res.gravite, statut: 'valider', iaSrc: res.src, lieu: c.lieu || res.lieu });
  const secondes = Math.max(1, Math.round((performance.now() - P.t0) / 1000));
  P.secondes = secondes;
  fait(l3, res.src === 'ia' ? 'Rédigé par l’IA dans le style de la banque' : res.src === 'banque' ? 'Tiré du constat type le plus proche' : 'Brouillon à compléter');
  majChrome();

  /* texte final (identique au flux quand l'IA a écrit ; sinon, il s'écrit vite sous les yeux) */
  carte.classList.remove('attente'); [tT, tC, tRi].forEach(x => x.classList.remove('curseur'));
  poserSev(c.gravite); sec.textContent = `${catLabel(c.cat)} › ${c.sub}`;
  if (enFlux) { tT.textContent = c.titre; tC.textContent = c.constat; tRi.textContent = c.reco; tR.hidden = !c.reco; }
  else {
    await taper(tT, c.titre, 250);
    await taper(tC, c.constat, Math.min(700, 6 * c.constat.length));
    tR.hidden = !c.reco; if (c.reco) await taper(tRi, c.reco, Math.min(450, 5 * c.reco.length));
  }
  vibrer(14);
  pied.append(
    h('div', { class: 'chrono' }, ic('clock', 18, 18), h('div', {}, h('b', {}, `${secondes} s`), h('small', {}, 'de la photo au constat rédigé')),
      h('div', { class: 'vs' }, h('b', {}, `~${MAIN_MINUTES} min`), h('small', {}, 'à la main'))),
    h('button', { class: 'go', onclick: () => { el.remove(); ouvrirRapport(c); } }, 'Voir mon rapport', ic('chevr2', 16, 16)));
  pied.hidden = false;
  requestAnimationFrame(() => el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' }));
}

        h('div', { class: 'suite', 'aria-hidden': 'true' }, h('i', { style: 'width:62%' }), h('i', { style: 'width:88%' }), h('i', { style: 'width:74%' }), h('i', { style: 'width:40%' })),
        h('div', { class: 'pied-papier' }, 'Préparé avec BatiFlow · banque de constats AIBQ')),

        h('button', { class: 'go', onclick: () => toast('Le PDF par courriel arrive avec le formulaire du site') }, 'Recevoir ce rapport en PDF'),
        h('button', { class: 'sec2', onclick: () => fermerRapport(c) }, 'Explorer BatiFlow librement'),

/* ---------- sur ordinateur : barre d'état d'iPhone + panneau « Essaie-le sur ton téléphone » ---------- */
const SITE = 'https://essai.batiflow.app/';   /* adresse publique ; dans l'aperçu claude.ai, le QR y mène */
function codeQR(texte) {
  const q = qrcode(0, 'M'); q.addData(texte); q.make();
  const n = q.getModuleCount(); let d = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) d += `M${x} ${y}h1v1h-1z`;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `-2 -2 ${n + 4} ${n + 4}`); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'Code QR vers ' + texte);
  const fond = document.createElementNS(svg.namespaceURI, 'rect'); fond.setAttribute('x', -2); fond.setAttribute('y', -2); fond.setAttribute('width', n + 4); fond.setAttribute('height', n + 4); fond.setAttribute('fill', '#fff');
  const path = document.createElementNS(svg.namespaceURI, 'path'); path.setAttribute('d', d); path.setAttribute('fill', '#111214');
  svg.append(fond, path); return svg;
}
function poserBureau() {
