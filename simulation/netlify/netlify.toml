# Essai BatiFlow — site Netlify séparé (ne touche pas à la vitrine batiflow.app)
[build]
  publish = "public"
  functions = "functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self)"
